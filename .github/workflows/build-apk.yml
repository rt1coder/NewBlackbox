name: Build APK (artifact)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK and NDK
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Lower Java version to 8
        run: |
          find . -name "build.gradle" -not -path "./.git/*" -exec sed -i -E 's/VERSION_(11|17|21)/VERSION_1_8/g' {} +
          grep -rn "VERSION_" --include=build.gradle . | head -20

      - name: Stamp engine build number
        run: |
          sed -i 's/BUILD = "dev"/BUILD = "${{ github.run_number }}"/' Bcore/src/main/java/top/niunaijun/blackbox/core/engine/MocgramEngine.java
          grep BUILD Bcore/src/main/java/top/niunaijun/blackbox/core/engine/MocgramEngine.java

      - name: Build libraries
        run: |
          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease :black-reflection:assemble --no-daemon

      - name: Recompile black-reflection for Java 8
        run: |
          mkdir -p br-classes
          javac --release 8 -d br-classes $(find black-reflection/src -name "*.java")
          (cd br-classes && jar cf ../black-reflection-java8.jar .)

      - name: Collect libraries
        run: |
          mkdir -p out
          cp Bcore/build/outputs/aar/Bcore-release.aar out/
          cp black-reflection-java8.jar out/
          find ~/.gradle ~/.m2 -type f \( -name "FreeReflection-*.aar" -o -name "FreeReflection-*.jar" -o -name "toml4j-*.jar" -o -name "gson-*.jar" \) ! -name "*sources*" -exec cp {} out/ \; || true
          ls -la out

      - name: Create classes.dex for each library
        run: |
          D8=$ANDROID_HOME/build-tools/35.0.0/d8
          AJ=$ANDROID_HOME/platforms/android-35/android.jar
          $D8 --version
          mkdir -p tmp/bcore tmp/fr dex/Bcore dex/black-reflection dex/FreeReflection dex/toml4j
          unzip -q -o out/Bcore-release.aar classes.jar -d tmp/bcore
          unzip -q -o out/FreeReflection-*.aar classes.jar -d tmp/fr
          BR=out/black-reflection-java8.jar
          TOML=$(ls out/toml4j-*.jar | head -n 1)
          $D8 --release --min-api 21 --lib $AJ --output dex/toml4j $TOML || echo "FAILED: toml4j"
          $D8 --release --min-api 21 --lib $AJ --output dex/FreeReflection tmp/fr/classes.jar || echo "FAILED: FreeReflection"
          $D8 --release --min-api 21 --lib $AJ --output dex/black-reflection $BR || echo "FAILED: black-reflection"
          $D8 --release --min-api 21 --lib $AJ --classpath $BR --classpath tmp/fr/classes.jar --classpath $TOML --output dex/Bcore tmp/bcore/classes.jar || echo "FAILED: Bcore"
          find dex -type f -exec ls -la {} \;

      - name: Show Java class versions
        run: |
          python3 - <<'EOF'
          import zipfile, glob, struct, io

          def major(z):
              for n in z.namelist():
                  if n.endswith('.class') and not n.startswith('META-INF'):
                      return struct.unpack('>H', z.read(n)[6:8])[0]

          for f in sorted(glob.glob('out/*')):
              try:
                  z = zipfile.ZipFile(f)
                  if f.endswith('.aar'):
                      z = zipfile.ZipFile(io.BytesIO(z.read('classes.jar')))
                  print(f, 'major', major(z), '(Java 8 = 52)')
              except Exception as e:
                  print(f, 'skip', e)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: bcore-libs
          path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: dex
          path: dex
